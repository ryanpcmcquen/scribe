name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Privacy guard (no literal home paths)
        run: |
          if grep -rn -E '/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.github; then
            echo "Error: literal home-directory path found in repository"
            exit 1
          fi
